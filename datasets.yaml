# Datasets the Studio can switch between. Managed by the Data tab; editable by hand.
inventory:
  label: Plant stores inventory movements (SAP, FY2020-25)
  url: sqlite:///data/inventory.db
  catalog: catalog_inventory.yaml
  problem: Total amount in lc (sum of inventory_movements.amount_in_lc) fell by 16%
    in Apr 2024 – Mar 2025 (2024-04-01 to 2025-03-31) compared with Apr 2023 – Mar
    2024 (2023-04-01 to 2024-03-31), from ₹113.5 crore to ₹95.1 crore, using inventory_movements.month_year
    as the date. Find the root cause.
  currency: INR
  sample_questions:
  - What is the total consumption value of materials issued to production orders for
    the financial year 2023-2024?
  - Which material category had the highest total quantity moved in the last quarter
    of 2023?
  - How many goods movements were recorded for cost centers in the financial year
    2022-2023?
  - What is the average unit price of materials issued to projects in the financial
    year 2024-2025?
  - Which top 5 materials had the highest consumption value in the financial year
    2023-2024?
  - What was the total quantity of materials issued to assets in the first half of
    the financial year 2024-2025 compared to the same period in the previous year?
  - How many goods movements were made in each consuming plant area for the financial
    year 2023-2024?
  - What is the total consumption value of materials categorized as fuel for the financial
    year 2022-2023?
  suggested_problems:
  - Total amount in lc (sum of inventory_movements.amount_in_lc) fell by 16% in Apr
    2024 – Mar 2025 (2024-04-01 to 2025-03-31) compared with Apr 2023 – Mar 2024 (2023-04-01
    to 2024-03-31), from ₹113.5 crore to ₹95.1 crore, using inventory_movements.month_year
    as the date. Find the root cause.
  - Total quantity (sum of inventory_movements.quantity) fell by 7% in Apr 2024 –
    Mar 2025 (2024-04-01 to 2025-03-31) compared with Apr 2023 – Mar 2024 (2023-04-01
    to 2024-03-31), from 7,697,009 to 7,151,939, using inventory_movements.month_year
    as the date. Find the root cause.
  - Total quantity (sum of inventory_movements.quantity) fell by 29% in Jan 2025 –
    Mar 2025 (2025-01-01 to 2025-03-31) compared with Oct 2024 – Dec 2024 (2024-10-01
    to 2024-12-31), from 1,969,904 to 1,391,627, using inventory_movements.month_year
    as the date. Find the root cause.
demo:
  label: Demo e-commerce (synthetic, injected payment incident)
  url: sqlite:///demo_data/demo.db
  catalog: catalog.yaml
  currency: INR
  problem: Revenue fell by about 20% in September 2026 compared with August 2026.
    Find the root cause.
  sample_questions:
  - What was completed revenue by region in August and September 2026?
  - What share of payments failed each week since August 2026?
  suggested_problems:
  - Revenue fell by about 20% in September 2026 compared with August 2026. Find the
    root cause.
retail_chain:
  label: Retail chain sales (Excel sample)
  url: sqlite:///data/datasets/retail_chain.db
  catalog: catalogs/retail_chain.yaml
  currency: INR
  problem: Total revenue inr (sum of sales.revenue_inr) fell by 7% in Jul 2025 – Sep
    2025 (2025-07-01 to 2025-09-30) compared with Apr 2025 – Jun 2025 (2025-04-01
    to 2025-06-30), from ₹2.3 crore to ₹2.1 crore, using sales.sale_date as the date.
    Find the root cause.
  suggested_problems:
  - Total revenue inr (sum of sales.revenue_inr) fell by 7% in Jul 2025 – Sep 2025
    (2025-07-01 to 2025-09-30) compared with Apr 2025 – Jun 2025 (2025-04-01 to 2025-06-30),
    from ₹2.3 crore to ₹2.1 crore, using sales.sale_date as the date. Find the root
    cause.
  - Total units sold (sum of sales.units_sold) fell by 7% in Jul 2025 – Sep 2025 (2025-07-01
    to 2025-09-30) compared with Apr 2025 – Jun 2025 (2025-04-01 to 2025-06-30), from
    180,987 to 168,843, using sales.sale_date as the date. Find the root cause.
  - Total units sold (sum of sales.units_sold) fell by 8% in Sep 2025 (2025-09-01
    to 2025-09-30) compared with Aug 2025 (2025-08-01 to 2025-08-31), from 55,931
    to 51,627, using sales.sale_date as the date. Find the root cause.
  sample_questions:
  - What is the total revenue generated from sales in each month for the year 2025?
  - Which products generated the highest revenue in the last quarter of 2024?
  - How many units of each product were sold in the city of Mumbai during September
    2025?
  - What is the average unit price of products in each category?
  - Which store had the highest number of sales transactions in 2024?
  - How does the total revenue in September 2025 compare to the total revenue in September
    2024?
  - What are the top 5 products by units sold in the year 2025?
  - How many stores were opened in each city since the beginning of 2024?
consumption_report_fy2020_2025:
  label: Consumption Report FY2020-2025
  url: sqlite:///data/datasets/consumption_report_fy2020_2025.db
  catalog: catalogs/consumption_report_fy2020_2025.yaml
  currency: INR
  problem: Describe a metric that rose or fell between two periods, then ask for the
    root cause.
  suggested_problems: []
  sample_questions:
  - What is the total consumption amount for each material category from fiscal year
    2020 to 2025?
  - Which materials had the highest consumption in fiscal year 2021?
  - How does the total consumption amount for materials in fiscal year 2022 compare
    to fiscal year 2023?
  - What is the monthly consumption trend for the top 5 materials in terms of quantity
    consumed during fiscal year 2022?
  - How many unique materials were consumed in each fiscal year from 2020 to 2023?
  - What is the average reorder quantity for materials across different categories?
  - Which month in fiscal year 2021 had the highest total consumption amount?
  - What is the total quantity consumed for each material in the last quarter of fiscal
    year 2023?
procurement_details:
  label: Procurement details
  url: sqlite:///data/datasets/procurement_details.db
  catalog: catalogs/procurement_details.yaml
  currency: INR
  problem: Total quantity (sum of procurement_details.quantity) rose by 11% in Nov
    2024 – Oct 2025 (2024-11-01 to 2025-10-31) compared with Nov 2023 – Oct 2024 (2023-11-01
    to 2024-10-31), from 7,787,732 to 8,629,852, using procurement_details.doc_date
    as the date. Find the root cause.
  suggested_problems:
  - Total quantity (sum of procurement_details.quantity) rose by 11% in Nov 2024 –
    Oct 2025 (2024-11-01 to 2025-10-31) compared with Nov 2023 – Oct 2024 (2023-11-01
    to 2024-10-31), from 7,787,732 to 8,629,852, using procurement_details.doc_date
    as the date. Find the root cause.
  - Total net value (sum of procurement_details.net_value) fell by 7% in Nov 2024
    – Oct 2025 (2024-11-01 to 2025-10-31) compared with Nov 2023 – Oct 2024 (2023-11-01
    to 2024-10-31), from ₹166.6 crore to ₹154.9 crore, using procurement_details.doc_date
    as the date. Find the root cause.
  - Total quantity (sum of procurement_details.quantity) rose by 18% in Aug 2025 –
    Oct 2025 (2025-08-01 to 2025-10-31) compared with May 2025 – Jul 2025 (2025-05-01
    to 2025-07-31), from 593,337 to 697,695, using procurement_details.doc_date as
    the date. Find the root cause.
  sample_questions:
  - What is the total net value of procurement transactions for each year from 2019
    to 2025?
  - Who are the top 5 vendors by total net value of materials supplied in 2023?
  - How does the total quantity procured in the first half of 2024 compare to the
    second half of the same year?
  - What is the breakdown of procurement transactions by procurement organization
    type for the year 2022?
  - How many unique procurement documents were created in each month of 2021?
  - What is the average net price of materials procured in 2020 compared to 2021?
  - Which material had the highest total net value in procurement transactions during
    the year 2023?
  - What is the total quantity of items procured in each currency for the year 2022?
shopsim:
  label: ShopSim enterprise (3.8M rows, 117 columns, 8 known incidents)
  url: sqlite:///data/shopsim.db
  catalog: catalogs/shopsim.yaml
  currency: INR
  problem: Revenue (sum of orders.amount for completed orders) changed by -13% in
    September 2025 (2025-09-01 to 2025-09-30) compared with 1-30 August 2025 (2025-08-01
    to 2025-08-30), using orders.order_date as the date. Find the root cause.
  suggested_problems:
  - Revenue (sum of orders.amount for completed orders) changed by -13% in September
    2025 (2025-09-01 to 2025-09-30) compared with 1-30 August 2025 (2025-08-01 to
    2025-08-30), using orders.order_date as the date. Find the root cause.
  - Cancelled orders (count of orders with status 'cancelled') changed by +115% in
    1-30 December 2024 (2024-12-01 to 2024-12-30) compared with November 2024 (2024-11-01
    to 2024-11-30), using orders.order_date as the date. Find the root cause.
  - Revenue (sum of orders.amount for completed orders) changed by -8% in February
    2025 (2025-02-01 to 2025-02-28) compared with 1-28 January 2025 (2025-01-01 to
    2025-01-28), using orders.order_date as the date. Find the root cause.
  - Revenue (sum of orders.amount for completed orders) changed by -12% in March 2025
    (2025-03-01 to 2025-03-31) compared with January 2025 (2025-01-01 to 2025-01-31),
    using orders.order_date as the date. Find the root cause.
  - Checkout conversion (share of website_sessions with converted = 1) changed by
    -11% in April 2025 (2025-04-01 to 2025-04-30) compared with March 2025 (2025-03-01
    to 2025-03-31), using website_sessions.session_ts as the date. Find the root cause.
  - Checkout conversion (share of website_sessions with converted = 1) changed by
    -14% in May 2025 (2025-05-01 to 2025-05-31) compared with March 2025 (2025-03-01
    to 2025-03-31), using website_sessions.session_ts as the date. Find the root cause.
  - Website sessions (count of website_sessions rows) changed by -14% in June 2025
    (2025-06-01 to 2025-06-30) compared with 1-30 May 2025 (2025-05-01 to 2025-05-30),
    using website_sessions.session_ts as the date. Find the root cause.
  - Website sessions (count of website_sessions rows) changed by -6% in September
    2025 (2025-09-01 to 2025-09-30) compared with 1-30 August 2025 (2025-08-01 to
    2025-08-30), using website_sessions.session_ts as the date. Find the root cause.
  sample_questions:
  - What was completed revenue by week in August and September 2025?
  - Which payment providers had the most failed payments in September 2025?
  - How many support tickets were opened per category each week since August 2025?
  - What was average checkout latency by device in September 2025?
  incidents:
  - id: S8
    title: Courier delays in the South
    month: Dec 2024
    metric: Cancelled orders (count of orders with status 'cancelled')
    date: orders.order_date
    incident:
    - '2024-12-01'
    - '2024-12-30'
    - 1-30 December 2024
    baseline:
    - '2024-11-01'
    - '2024-11-30'
    - November 2024
    cause: Courier SwiftShip had delays in the South region all December (delivery_days
      rose from 2-4 to 6-10), and about a third of those orders were cancelled.
    signature: Cancellations concentrated in courier SwiftShip and region South; delivery_days
      jumps; delivery tickets spike.
    keywords:
    - - swiftship
    - - south
    required:
    - orders.status
    - orders.order_date
    - orders.courier
    - orders.region
    - orders.delivery_days
    problem: Cancelled orders (count of orders with status 'cancelled') changed by
      +115% in 1-30 December 2024 (2024-12-01 to 2024-12-30) compared with November
      2024 (2024-11-01 to 2024-11-30), using orders.order_date as the date. Find the
      root cause.
    change: 1.1494
    baseline_value: 1546.0
    incident_value: 3323.0
  - id: S4
    title: Regional warehouse outage
    month: Feb 2025
    metric: Revenue (sum of orders.amount for completed orders)
    date: orders.order_date
    incident:
    - '2025-02-01'
    - '2025-02-28'
    - February 2025
    baseline:
    - '2025-01-01'
    - '2025-01-28'
    - 1-28 January 2025
    cause: A warehouse outage in the East region from 10 February onwards removed
      about 90% of East orders for the rest of the month.
    signature: One region's orders collapse from 10 Feb; other regions are normal.
    keywords:
    - - east
    required:
    - orders.amount
    - orders.status
    - orders.order_date
    - orders.region
    problem: Revenue (sum of orders.amount for completed orders) changed by -8% in
      February 2025 (2025-02-01 to 2025-02-28) compared with 1-28 January 2025 (2025-01-01
      to 2025-01-28), using orders.order_date as the date. Find the root cause.
    change: -0.0765
    baseline_value: 314425791.2
    incident_value: 290358977.8
  - id: S3
    title: Best-seller out of stock
    month: Mar 2025
    metric: Revenue (sum of orders.amount for completed orders)
    date: orders.order_date
    incident: &id001
    - '2025-03-01'
    - '2025-03-31'
    - March 2025
    baseline:
    - '2025-01-01'
    - '2025-01-31'
    - January 2025
    cause: The best-selling product, 'Zentra Phones X1' (product_id 1, ₹24,999), was
      out of stock from 5 March, so its sales fell to zero.
    signature: Electronics revenue falls; one product_id disappears from orders; other
      products are normal.
    keywords:
    - - x1
      - product_id 1
      - product 1
      - product id 1
      - zentra phone
    required:
    - orders.amount
    - orders.status
    - orders.order_date
    - orders.product_id
    - products.product_id
    - products.name
    problem: Revenue (sum of orders.amount for completed orders) changed by -12% in
      March 2025 (2025-03-01 to 2025-03-31) compared with January 2025 (2025-01-01
      to 2025-01-31), using orders.order_date as the date. Find the root cause.
    change: -0.1192
    baseline_value: 347547842.2
    incident_value: 306111699.4
  - id: S6
    title: Faulty front-end release on Safari
    month: Apr 2025
    metric: Checkout conversion (share of website_sessions with converted = 1)
    date: website_sessions.session_ts
    incident:
    - '2025-04-01'
    - '2025-04-30'
    - April 2025
    baseline: *id001
    cause: checkout-web v5.2.0, deployed 8 April 14:00, broke checkout on Safari (error_code
      'JS_CHUNK_LOAD_FAILED'); Safari conversion fell from about 24% to about 5% until
      the 30 April hotfix.
    signature: Conversion drop concentrated in browser Safari; JS_CHUNK_LOAD_FAILED
      errors appear after a checkout-web deployment.
    keywords:
    - - safari
    required:
    - website_sessions.converted
    - website_sessions.session_ts
    - website_sessions.browser
    - website_sessions.error_code
    - deployment_logs.service
    - deployment_logs.deployed_at
    problem: Checkout conversion (share of website_sessions with converted = 1) changed
      by -11% in April 2025 (2025-04-01 to 2025-04-30) compared with March 2025 (2025-03-01
      to 2025-03-31), using website_sessions.session_ts as the date. Find the root
      cause.
    change: -0.1117
    baseline_value: 0.2413
    incident_value: 0.2144
  - id: S5
    title: Database latency degradation
    month: May 2025
    metric: Checkout conversion (share of website_sessions with converted = 1)
    date: website_sessions.session_ts
    incident:
    - '2025-05-01'
    - '2025-05-31'
    - May 2025
    baseline: *id001
    cause: inventory v3.9.0 moved stock reads to a shared database cluster on 10 May;
      checkout latency rose from about 0.9 s to about 2.1 s on every device and conversion
      fell, until the 1 June revert.
    signature: checkout_latency_ms more than doubles for everyone from 10 May; conversion
      falls across all browsers and devices.
    keywords:
    - - latency
      - slow
    required:
    - website_sessions.converted
    - website_sessions.session_ts
    - website_sessions.checkout_latency_ms
    problem: Checkout conversion (share of website_sessions with converted = 1) changed
      by -14% in May 2025 (2025-05-01 to 2025-05-31) compared with March 2025 (2025-03-01
      to 2025-03-31), using website_sessions.session_ts as the date. Find the root
      cause.
    change: -0.1403
    baseline_value: 0.2413
    incident_value: 0.2075
  - id: S2
    title: Organic traffic decline
    month: Jun 2025
    metric: Website sessions (count of website_sessions rows)
    date: website_sessions.session_ts
    incident:
    - '2025-06-01'
    - '2025-06-30'
    - June 2025
    baseline:
    - '2025-05-01'
    - '2025-05-30'
    - 1-30 May 2025
    cause: search v2.9.0 shipped a new robots.txt on 3 June; organic (search-engine)
      sessions fell by about 45% for the rest of June.
    signature: Sessions fall only for source 'organic'; paid, social and direct are
      normal.
    keywords:
    - - organic
    required:
    - website_sessions.session_ts
    - website_sessions.source
    problem: Website sessions (count of website_sessions rows) changed by -14% in
      June 2025 (2025-06-01 to 2025-06-30) compared with 1-30 May 2025 (2025-05-01
      to 2025-05-30), using website_sessions.session_ts as the date. Find the root
      cause.
    change: -0.1377
    baseline_value: 201230.0
    incident_value: 173518.0
  - id: S7
    title: Marketing campaign ended
    month: Sep 2025
    metric: Website sessions (count of website_sessions rows)
    date: website_sessions.session_ts
    incident: &id002
    - '2025-09-01'
    - '2025-09-30'
    - September 2025
    baseline: &id003
    - '2025-08-01'
    - '2025-08-30'
    - 1-30 August 2025
    cause: The 'Monsoon Mega Sale' paid campaign (campaign_id 1) ended on 31 August,
      so paid sessions fell back to normal in September.
    signature: Sessions fall for source 'paid' / campaign_id 1; the campaign's end_date
      is 2025-08-31.
    keywords:
    - - paid
      - campaign
      - monsoon
    required:
    - website_sessions.session_ts
    - website_sessions.source
    - website_sessions.campaign_id
    - marketing_campaigns.end_date
    problem: Website sessions (count of website_sessions rows) changed by -6% in September
      2025 (2025-09-01 to 2025-09-30) compared with 1-30 August 2025 (2025-08-01 to
      2025-08-30), using website_sessions.session_ts as the date. Find the root cause.
    change: -0.0637
    baseline_value: 221844.0
    incident_value: 207715.0
  - id: S1
    title: Payment-service deployment regression
    month: Sep 2025
    metric: Revenue (sum of orders.amount for completed orders)
    date: orders.order_date
    incident: *id002
    baseline: *id003
    cause: 'payment-service v4.8.0, deployed 12 September 10:30, broke card payments
      routed through the provider ''Atlas'' (failure_reason ''3DS callback timeout''):
      their failure rate went from about 2.5% to about 45%.'
    signature: Failed card payments via Atlas jump after 12 Sep; orders end as payment_failed;
      payment tickets spike. Part of the drop is also the campaign ending (S7).
    keywords:
    - - atlas
    required:
    - orders.amount
    - orders.status
    - orders.order_date
    - payments.status
    - payments.provider
    - payments.failure_reason
    - deployment_logs.service
    - deployment_logs.version
    - deployment_logs.deployed_at
    problem: Revenue (sum of orders.amount for completed orders) changed by -13% in
      September 2025 (2025-09-01 to 2025-09-30) compared with 1-30 August 2025 (2025-08-01
      to 2025-08-30), using orders.order_date as the date. Find the root cause.
    change: -0.132
    baseline_value: 385180621.05
    incident_value: 334336920.05
